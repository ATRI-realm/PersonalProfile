  口算练习 · 出题台 —— 单文件版

  这张页面是自包含的：样式、出题引擎、页面脚本、图标全部内联在下面，
  没有任何外部依赖，双击即可使用（file:// 下也能跑）。

  出题逻辑的权威实现在 Python 侧（src/simple_calculate/），这里是它的移植版。
  两者的一致性由 tests/test_engine_parity.py 交叉验证盯着——它按 sc-engine 这个 id
  把引擎脚本从这张页面里抠出来、放到 Node 下跑，所以那个标记不要改。
-->

<style>
/* ==========================================================================
   口算练习 · 出题台
   视觉取向：一张摆在桌面上的练习卷。纸 + 墨 + 朱红批改笔，
   而不是通用的后台仪表盘——卷面才是主角，控件只该退到边上。
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;

  --desk:        #e7e5df;
  --paper:       #fffefb;

  --ink:         #1b1e23;
  --ink-2:       #585e66;
  --ink-3:       #8d939b;

  --line:        #e4e1da;
  --line-2:      #d3cfc7;
  --rule:        #ccd9e6;   /* 卷面题行虚线：极淡的蓝，像作业本格线 */

  --brand:       #1e2b3a;
  --accent:      #2d5c8a;
  --accent-ink:  #1d3f61;
  --accent-soft: #e9f0f7;
  --mark:        #b4463a;   /* 题号：朱红 */

  --warn:        #855c13;
  --warn-bg:     #fdf5e2;
  --warn-line:   #ead7a3;
  --danger:      #a83a2e;

  --radius:      13px;
  --radius-sm:   9px;
  --shadow-1:    0 1px 2px rgba(28,32,38,.05), 0 1px 7px rgba(28,32,38,.04);
  --shadow-2:    0 2px 5px rgba(28,32,38,.06), 0 14px 36px rgba(28,32,38,.10);

  --font-ui:  "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI",
              system-ui, -apple-system, sans-serif;
  --font-num: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas,
              "Menlo", "DejaVu Sans Mono", monospace;
  --font-hand: "Kaiti SC", "KaiTi", "STKaiti", "SimSun", serif;
}

html { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─────────────────────────── 顶栏 ─────────────────────────── */

.app { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 20px;
  background: var(--brand);
  color: #e9eef5;
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

.brand-mark {
  display: grid;
  place-items: center;
  width: 32px; height: 32px;
  flex: none;
  border-radius: 9px;
  background: linear-gradient(150deg, #3a6f9e, #24486b);
  color: #fff;
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 700;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
}

.brand-text { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.brand-text b { font-size: 15.5px; font-weight: 600; letter-spacing: .04em; }
.brand-text i {
  font-style: normal;
  font-size: 12px;
  color: #93a7bd;
  letter-spacing: .1em;
}

.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* ─────────────────────────── 按钮 ─────────────────────────── */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 15px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, transform .06s;
}
.btn:active { transform: translateY(1px); }
.btn svg { flex: none; }

.btn-ghost {
  background: rgba(255,255,255,.09);
  border-color: rgba(255,255,255,.16);
  color: #dde6ef;
}
.btn-ghost:hover { background: rgba(255,255,255,.17); color: #fff; }
.btn-ghost.done { background: rgba(126,201,160,.24); border-color: rgba(126,201,160,.44); color: #d5f0e0; }
/* 「显示答案」处于开启状态：深蓝顶栏上给一点暖色，和朱红批改笔同一族 */
.btn-ghost.on {
  background: rgba(214,158,86,.24);
  border-color: rgba(214,158,86,.5);
  color: #f6e2c4;
}
.btn-ghost.on:hover { background: rgba(214,158,86,.34); color: #fdf1de; }

.btn-primary {
  width: 100%;
  padding: 11px 16px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .04em;
  box-shadow: 0 1px 2px rgba(29,63,97,.28);
}
.btn-primary:hover { background: var(--accent-ink); }
.btn-primary:disabled { opacity: .55; cursor: default; transform: none; }

.link-btn {
  border: none;
  background: none;
  padding: 3px 5px;
  border-radius: 6px;
  color: var(--ink-3);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: color .15s, background .15s;
}
.link-btn:hover { color: var(--accent); background: var(--accent-soft); }

.chip-btn {
  padding: 7px 13px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--ink-2);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ─────────────────────────── 布局 ─────────────────────────── */

.workspace {
  display: grid;
  grid-template-columns: minmax(272px, 302px) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
  width: 100%;
  max-width: 1420px;
  margin: 0 auto;
  padding: 22px;
}

/* ─────────────────────────── 设置面板 ─────────────────────────── */

.panel {
  position: sticky;
  top: 76px;
  display: flex;
  flex-direction: column;
  min-width: 0;            /* 不被内部内容撑宽（否则窄屏会横向溢出） */
  max-height: calc(100vh - 100px);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 17px 11px;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .1em;
  color: var(--ink);
}

.panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 17px 14px;
  overscroll-behavior: contain;
}
.panel-body::-webkit-scrollbar { width: 9px; }
.panel-body::-webkit-scrollbar-thumb {
  background: #ddd9d1;
  border-radius: 5px;
  border: 2px solid #fff;
}
.panel-body::-webkit-scrollbar-thumb:hover { background: #c9c4bb; }

.panel-foot {
  padding: 13px 17px 15px;
  border-top: 1px solid var(--line);
  background: #fcfbf8;
}

/* ─────────────────────────── 表单 ─────────────────────────── */

.field { padding: 11px 0; }

.field-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}
.field-head > span,
.field-head > label {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.field-hint { font-size: 11.5px; color: var(--ink-3); }
.field-value {
  font-family: var(--font-num);
  font-size: 12.5px;
  color: var(--accent);
  font-weight: 600;
}

.field-line { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

.num {
  width: 78px;
  padding: 7px 9px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  text-align: center;
  transition: border-color .15s, box-shadow .15s;
}
.num:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.num-wide { width: 118px; text-align: left; }
.num::placeholder { color: #b6bbc2; font-size: 12.5px; }

/* 小圆角标签按钮 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button {
  padding: 6px 10px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: #fff;
  color: var(--ink-2);
  font: inherit;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background .14s, border-color .14s, color .14s;
}
.chips button:hover { border-color: var(--ink-3); color: var(--ink); }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 运算符选择：四个方块 */
.chips-ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.chips-ops button {
  padding: 9px 0;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  background: #fff;
  color: var(--ink-3);
  font-family: var(--font-num);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  transition: background .14s, border-color .14s, color .14s, transform .08s;
}
.chips-ops button:hover { border-color: var(--ink-3); color: var(--ink); }
.chips-ops button.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 1px 3px rgba(29,63,97,.28);
}
.chips-ops button:active { transform: translateY(1px); }

/* 分段控制器 */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 3px;
  padding: 3px;
  background: #f2f0ea;
  border: 1px solid var(--line);
  border-radius: 11px;
}
.seg button {
  padding: 7px 4px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background .14s, color .14s, box-shadow .14s;
}
.seg button:hover { color: var(--ink); }
.seg button.on {
  background: #fff;
  color: var(--accent-ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(28,32,38,.11);
}
.seg-stack {
  grid-auto-flow: row;
  grid-auto-columns: auto;
}
.seg-stack button { padding: 8px 10px; text-align: left; font-size: 12.5px; }

/* 滑块 */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  margin: 5px 0 0;
  border-radius: 2px;
  background: linear-gradient(
    to right,
    var(--accent) 0 var(--fill, 50%),
    #dedad2 var(--fill, 50%) 100%
  );
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--accent);
  box-shadow: 0 1px 4px rgba(28,32,38,.2);
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--accent);
  box-shadow: 0 1px 4px rgba(28,32,38,.2);
  cursor: pointer;
}
input[type="range"]:focus-visible::-webkit-slider-thumb {
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.range-legend {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-size: 11px;
  color: var(--ink-3);
}

/* 开关 */
.switch {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 9px 0;
  cursor: pointer;
  user-select: none;
}
.switch-text { font-size: 13px; color: var(--ink); line-height: 1.35; }
.switch-text small {
  display: block;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.45;
}
.switch input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.switch .track {
  position: relative;
  flex: none;
  width: 38px; height: 22px;
  margin-top: 1px;
  border-radius: 11px;
  background: #d8d4cc;
  transition: background .18s;
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.24);
  transition: transform .18s;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }
.switch input:disabled + .track { opacity: .45; }
.switch:has(input:disabled) { cursor: default; opacity: .6; }

/* 折叠区 */
.more {
  margin-top: 6px;
  border-top: 1px solid var(--line);
}
.more > summary {
  display: flex;
  align-items: center;
  gap: 6px;
  list-style: none;
  padding: 12px 0 8px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: .06em;
  cursor: pointer;
  transition: color .15s;
}
.more > summary::-webkit-details-marker { display: none; }
.more > summary:hover { color: var(--accent); }
.more > summary::after {
  content: "";
  width: 6px; height: 6px;
  margin-left: auto;
  border-right: 1.6px solid currentColor;
  border-bottom: 1.6px solid currentColor;
  transform: rotate(45deg);
  transition: transform .2s;
}
.more[open] > summary::after { transform: rotate(-135deg); }

.group-label {
  margin: 16px 0 2px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  color: var(--ink-3);
}
.group-note {
  margin: 7px 0 0;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--ink-3);
}

/* 权重 */
.weights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 9px; }
.weights label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.weights label > span {
  font-family: var(--font-num);
  font-size: 14px;
  color: var(--ink-2);
}
.weights .num { width: 100%; }

/* ─────────────────────────── 卷面 ─────────────────────────── */

.stage {
  display: flex;
  flex-direction: column;
  gap: 13px;
  min-width: 0;
}

.paper {
  position: relative;
  padding: 42px 46px 50px;
  /* 让纸占满一屏：练习卷的语感是"一整页"，而不是视口上方的半张 */
  min-height: clamp(460px, calc(100vh - 200px), 1120px);
  background: var(--paper);
  border: 1px solid #ece8df;
  border-radius: 5px;
  box-shadow: var(--shadow-2);
}

.paper-head { margin-bottom: 24px; }

.paper-title {
  margin: 0 0 20px;
  font-family: var(--font-hand);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: .22em;
  text-indent: .22em;
  text-align: center;
  color: var(--ink);
  outline: none;
  border-radius: 7px;
  transition: background .15s, box-shadow .15s;
}
.paper-title:hover { background: #f5f8fb; }
.paper-title:focus {
  background: #f2f7fb;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.paper-meta {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px 30px;
  padding-bottom: 13px;
  border-bottom: 1.5px solid var(--rule);
  font-size: 12.5px;
  color: var(--ink-2);
}
.paper-meta[hidden] { display: none; }
.meta-cell { display: inline-flex; align-items: baseline; gap: 5px; }
.meta-cell .fill {
  display: inline-block;
  width: 86px;
  height: 1px;
  border-bottom: 1px solid var(--ink-3);
  transform: translateY(-3px);
}
.meta-cell .fill-short { width: 52px; }

.grid {
  display: grid;
  /* 列数是「上限」，不是硬指标：先按用户选的列数排，排不下就自动少一列，
     而不是把字压小、或让答案折到下一行。
     判据是每列至少装得下最长的一种算式（形如 (100 − 99) × 9 =，16 个等宽
     字符）加上题号与答案——实测约需 13.2 倍算式字号的宽度。
     这件事不能靠断点凑：实际列宽由窗口宽度、面板、页边距、页宽叠加决定，
     断点算不准，凑出来的字号总会在某个宽度上失手。 */
  --col-gap: 22px;
  --expr-size: 1rem;
  --col-min: calc(var(--expr-size) * 13.2);
  --wanted: calc((100% - (var(--per-line, 4) - 1) * var(--col-gap)) / var(--per-line, 4));
  grid-template-columns: repeat(auto-fit,
      minmax(min(100%, max(var(--col-min), var(--wanted))), 1fr));
  column-gap: var(--col-gap);
}
/* 列数少时每列更宽，字就没必要憋着 */
.grid[data-per-line="2"] { --expr-size: 1.3rem; }
.grid[data-per-line="3"] { --expr-size: 1.15rem; }
.grid[data-per-line="4"] { --expr-size: 1rem; }

.item {
  display: flex;
  align-items: baseline;
  /* 算式绝不折行——一道题被拆成两行就不成题面了；答案只在列宽真的不够时
     折到下一行兜底，正常的列宽不该走到那一步。 */
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
  padding: 13px 1px 9px;
  border-bottom: 1px dashed var(--rule);
}
.item .idx {
  flex: none;
  min-width: 2em;
  text-align: right;
  font-family: var(--font-num);
  font-size: .76em;
  font-weight: 600;
  color: var(--mark);
  opacity: .82;
}
.item .expr {
  font-family: var(--font-num);
  font-size: var(--expr-size);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--ink);
}
/* 答案：朱红，和卷面题号同一支笔——但要压得住，不跟算式抢视线 */
.item .ans {
  font-family: var(--font-num);
  font-size: calc(var(--expr-size) * .92);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--mark);
}

.paper-placeholder {
  margin: 0;
  padding: 40px 0;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
}
.paper-placeholder[hidden] { display: none; }

/* 提示条 */
.hint {
  display: flex;
  gap: 9px;
  margin: 0;
  padding: 11px 14px;
  background: var(--warn-bg);
  border: 1px solid var(--warn-line);
  border-left: 3px solid #d9a93e;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--warn);
}
.hint[hidden] { display: none; }
.hint::before { content: "!"; font-weight: 700; flex: none; }
.hint.error {
  background: #fdeeec;
  border-color: #f0c8c3;
  border-left-color: var(--danger);
  color: var(--danger);
}

/* 状态栏 */
.statusbar {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 3px;
  font-size: 12.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.statusbar .sep { flex: none; width: 1px; height: 11px; background: var(--line-2); }
.statusbar .grow { flex: 1; }

.seed-btn {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 3px 8px;
  border: none;
  border-radius: 7px;
  background: none;
  color: var(--ink-3);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.seed-btn:hover { background: rgba(255,255,255,.7); color: var(--ink-2); }
.seed-btn b { color: var(--ink-2); font-weight: 600; }
.seed-btn.done { background: #e2f0e7; color: #2f6b4f; }
.seed-btn.done b { color: #2f6b4f; }

/* 从简历站跳转过来的那一行说明。只在这里出现时才有内容，
   直接双击打开文件时它是空的、不占位。 */
.backbar {
  padding: 8px 22px;
  border-bottom: 1px solid var(--line-2);
  background: rgba(255,255,255,.55);
  font-size: 12.5px;
  color: var(--ink-3);
}
.backbar[hidden] { display: none; }
.backbar a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line-1); }
.backbar a:hover { color: #2f6b4f; border-color: #2f6b4f; }

/* ─────────────────────────── 窄屏 ─────────────────────────── */

@media (max-width: 960px) {
  .workspace {
    grid-template-columns: 1fr;
    gap: 15px;
    padding: 15px;
  }
  .panel { position: static; max-height: none; }
  .panel-body { overflow: visible; }
  .paper { padding: 28px 22px 34px; min-height: 400px; }
  .paper-title { font-size: 23px; }
  .brand-text i { display: none; }
}

@media (max-width: 560px) {
  .topbar { padding: 10px 13px; }
  .btn span { display: none; }
  .btn { padding: 8px 10px; }
  .paper { padding: 22px 15px 28px; }
  .grid { --col-gap: 14px; }
}

</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">±</span>
      <span class="brand-text"><b>口算练习</b></span>
    </div>

    <div class="topbar-actions">
      <button class="btn btn-ghost" id="answerBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <path d="M1.7 8s2.3-4.3 6.3-4.3S14.3 8 14.3 8s-2.3 4.3-6.3 4.3S1.7 8 1.7 8Z"
                fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="8" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span>显示答案</span>
      </button>

      <button class="btn btn-ghost" id="copyBtn" type="button">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <rect x="5.5" y="5.5" width="9" height="9" rx="1.6" fill="none"
                stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 3.5v-.4a1.6 1.6 0 0 0-1.6-1.6H3.1A1.6 1.6 0 0 0 1.5 3.1v5.8a1.6 1.6 0 0 0 1.6 1.6H3.5"
                fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>复制题面</span>
      </button>

    </div>
  </header>

  <div class="workspace">

    <!-- ───────────────── 出题设置 ───────────────── -->
    <aside class="panel">
      <div class="panel-head">
        <h2>出题设置</h2>
        <button class="link-btn" id="resetBtn" type="button">重置</button>
      </div>

      <div class="panel-body">

        <section class="field">
          <div class="field-head">
            <label for="countInput">题目数量</label>
            <span class="field-hint" id="countHint"></span>
          </div>
          <div class="field-line">
            <input class="num" type="number" id="countInput" min="1" max="1000" step="1" value="20">
            <div class="chips">
              <button type="button" data-count="12">12</button>
              <button type="button" data-count="20">20</button>
              <button type="button" data-count="30">30</button>
              <button type="button" data-count="50">50</button>
            </div>
          </div>
        </section>

        <section class="field">
          <div class="field-head"><span>参与运算</span></div>
          <div class="chips-ops" id="opsBox">
            <button type="button" data-op="+" class="on" title="加法">+</button>
            <button type="button" data-op="-" class="on" title="减法">−</button>
            <button type="button" data-op="*" class="on" title="乘法">×</button>
            <button type="button" data-op="/" class="on" title="除法">÷</button>
          </div>
        </section>

        <section class="field">
          <div class="field-head"><span>每题的运算符个数</span></div>
          <div class="seg" id="opCountBox">
            <button type="button" data-v="1">一个</button>
            <button type="button" data-v="2">两个</button>
            <button type="button" data-v="1,2" class="on">混合</button>
          </div>
        </section>

        <section class="field" id="ratioField">
          <div class="field-head">
            <span>单运算符题的比例</span>
            <output class="field-value" id="ratioOut">5 : 5</output>
          </div>
          <input type="range" id="ratioRange" min="1" max="9" step="1" value="5"
                 aria-label="单运算符题目所占比例">
          <div class="range-legend"><span>双运算符多</span><span>单运算符多</span></div>
        </section>

        <section class="field">
          <div class="field-head">
            <span>每行排几题</span>
            <!-- 列数是上限：窗口不够宽时实际列数会自己少一档，这里如实说出来，
                 免得面板上写着 4、卷面上却排了 2。 -->
            <span class="field-hint" id="perLineHint"></span>
          </div>
          <div class="seg" id="perLineBox">
            <button type="button" data-v="2">2</button>
            <button type="button" data-v="3">3</button>
            <button type="button" data-v="4" class="on">4</button>
          </div>
        </section>

        <details class="more" id="moreBox">
          <summary>数值选项</summary>
          <section class="field">
            <div class="field-head">
              <label for="maxValueInput">操作数最大值</label>
            </div>
            <div class="field-line">
              <input class="num" type="number" id="maxValueInput" min="10" max="99" step="1" value="99">
              <div class="chips">
                <button type="button" data-max="20">20</button>
                <button type="button" data-max="50">50</button>
                <button type="button" data-max="99">99</button>
              </div>
            </div>
          </section>

          <label class="switch">
            <span class="switch-text">允许 0 参与运算</span>
            <input type="checkbox" id="allowZeroInput">
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="switch-text">乘法限制在九九表内</span>
            <input type="checkbox" id="mulTableInput" checked>
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="switch-text">允许结果为 0</span>
            <input type="checkbox" id="zeroResultInput" checked>
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="switch-text">过滤过于简单的乘除题</span>
            <input type="checkbox" id="trivialInput" checked>
            <span class="track"></span>
          </label>
        </details>
      </div>

      <div class="panel-foot">
        <button class="btn btn-primary" id="shuffleBtn" type="button">生成新题</button>
      </div>
    </aside>

    <!-- ───────────────── 卷面 ───────────────── -->
    <main class="stage">
      <article class="paper" id="paper">
        <header class="paper-head">
          <h1 class="paper-title" id="paperTitle" contenteditable="true"
              spellcheck="false" title="可点击修改标题">口算练习</h1>
          <div class="paper-meta" id="paperMeta">
            <span class="meta-cell">姓名<b class="fill"></b></span>
            <span class="meta-cell">日期<b class="fill"></b></span>
            <span class="meta-cell">用时<b class="fill fill-short"></b></span>
          </div>
        </header>

        <div class="grid" id="grid" data-per-line="4"></div>
        <p class="paper-placeholder" id="paperPlaceholder">正在出题…</p>
      </article>

      <p class="hint" id="hint" hidden></p>

      <div class="statusbar">
        <span id="statusCount">—</span>
        <span class="sep"></span>
        <span id="statusMix">—</span>
      </div>
    </main>
  </div>
</div>

<!-- 引擎与页面脚本都内联在此，且必须是「经典脚本」：file:// 下 ES module 会被
     CORS 拦掉，而经典 script 可以正常加载。这张页面因此自带全部依赖。 -->
<script id="sc-engine">
/* ==========================================================================
   口算练习 · 浏览器版出题引擎

   为什么会有这份文件
   ------------------
   这张页面要能双击直接打开（`file://`），而 `file://` 下浏览器既不允许页面抓取
   本地服务，也不允许跑 ES module，所以出题能力只能跟着页面走进浏览器。代价是：
   生成逻辑在浏览器里多了一份实现（权威版在 src/simple_calculate/）。
   为把漂移风险压到最低，这里做三件事：

     1. **逐函数对应**：下面每一节都标注了它对应 Python 侧的哪个文件与函数，
        移植时不做"顺手优化"，连迭代顺序、抽样顺序都保持一致；
     2. **保留独立校验器**：`§4` 的求值器只依据标准优先级解析题面文本、不读树结构，
        与 Python 侧同样是独立于生成路径的第二视角；每题出完后立刻自校验，
        不通过就抛错（与命令行版行为一致：宁可失败，不输出错题）；
     3. **可被交叉验证**：本文件在 Node 下同样能加载（挂在 globalThis 上），
        因此可以让浏览器引擎成批出题、再全部交回 Python 那份校验器复核。

   放在根对象上而不是模块里，是因为经典 <script> 在 file:// 下可以加载，
   而 ES module 会被 CORS 拦下（已实测）。

   覆盖的 Python 出处：
     config.py   → §0 运算符元数据、§1 参数与校验
     core.py     → §2 基础运算与候选集
     model.py    → §3 表达式树
     validate.py → §4 独立求值器、§5 硬约束判定
     render.py   → §6 括号决策与文本渲染
     generator.py→ §7 生成调度
     web.py      → §8 出题入口（meta / generate 两个函数）
   ========================================================================== */

(function (global) {
  'use strict';

  /* ────────────────────────────────────────────────────────────────────────
     §0 运算符元数据（config.py）
     ──────────────────────────────────────────────────────────────────────── */

  const ALL_OPS = ['+', '-', '*', '/'];
  const OP_DISPLAY = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  const OP_PRECEDENCE = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const PAREN_MODES = ['none', 'necessary', 'always'];

  const SYMBOL_ALIASES = {
    '×': '*', '⋅': '*', '·': '*', '÷': '/', '−': '-',
    '–': '-', '—': '-', '＋': '+', '－': '-',
  };

  const NORMALIZE_MAP = { '×': '*', '÷': '/', '−': '-', '⋅': '*', '·': '*' };

  /* ────────────────────────────────────────────────────────────────────────
     §1 参数（config.py 的 Config）

     默认值必须与 Python 侧逐字一致——meta() 会把它发给界面，
     界面照着它初始化表单，所以这里是"默认值"的唯一出处（本地模式下）。
     ──────────────────────────────────────────────────────────────────────── */

  const DEFAULT_CONFIG = {
    count: 20,
    ops: ['+', '-', '*', '/'],
    weights: null,
    operator_counts: [1, 2],
    ratio: [1, 1],
    min_value: 1,
    max_value: 99,
    max_result: 100,
    mul_min: 1,
    mul_max: 9,
    paren: 'necessary',
    allow_zero_result: true,
    exclude_trivial: true,
    exclude_zero_forms: true,
    allow_repeat: false,
    per_line: 4,
    seed: null,
    attempts_per_problem: 300,
  };

  const INT_FIELDS = new Set([
    'count', 'min_value', 'max_value', 'max_result', 'mul_min', 'mul_max',
    'per_line', 'attempts_per_problem',
  ]);
  const BOOL_FIELDS = new Set([
    'allow_zero_result', 'exclude_trivial', 'exclude_zero_forms', 'allow_repeat',
  ]);
  const TUPLE_FIELDS = new Set(['ops', 'operator_counts', 'ratio']);

  /** 把界面传来的值收敛成 Config 期望的类型（对应 web.py 的 _coerce）。 */
  function coerceField(name, value) {
    if (INT_FIELDS.has(name)) {
      if (typeof value === 'boolean' || !['number', 'string'].includes(typeof value)) {
        throw new Error(`${name} 必须是整数`);
      }
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) throw new Error(`${name} 必须是整数，收到 ${value}`);
      return parsed;
    }
    if (BOOL_FIELDS.has(name)) {
      if (typeof value !== 'boolean') throw new Error(`${name} 必须是布尔值`);
      return value;
    }
    if (TUPLE_FIELDS.has(name)) {
      if (!Array.isArray(value)) throw new Error(`${name} 必须是数组`);
      // 元素类型不在这里转换：Python 侧的 _coerce 同样只是 tuple(value)，
      // 元素对不对由 validate_config 负责判。ops 是运算符字符串数组，
      // 曾在这里被 Number() 转成 NaN，交叉验证第一次跑就抓到了。
      return value.slice();
    }
    if (name === 'paren') {
      if (typeof value !== 'string') throw new Error('paren 必须是字符串');
      return value;
    }
    if (name === 'weights') {
      if (value === null || value === undefined) return null;
      if (Array.isArray(value) && value.length === 0) return null;
      if (typeof value !== 'object') throw new Error('weights 必须是对象或 null');
      const out = {};
      for (const key of Object.keys(value)) {
        const amount = Number.parseInt(value[key], 10);
        if (!Number.isFinite(amount)) throw new Error('weights 的值必须是整数');
        out[key] = amount;
      }
      return out;
    }
    if (name === 'seed') {
      if (value === null || value === '' || value === 'null') return null;
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) throw new Error(`seed 必须是整数或留空，收到 ${value}`);
      return parsed;
    }
    return value;
  }

  function configFromPayload(payload) {
    if (payload === null || typeof payload !== 'object' || Array.isArray(payload)) {
      throw new Error('请求体必须是一个 JSON 对象');
    }
    const unknown = Object.keys(payload).filter((key) => !(key in DEFAULT_CONFIG)).sort();
    if (unknown.length) throw new Error(`无法识别的参数：${unknown.join('、')}`);

    const cfg = Object.assign({}, DEFAULT_CONFIG);
    for (const key of Object.keys(payload)) {
      cfg[key] = coerceField(key, payload[key]);
    }
    cfg.ops = cfg.ops.slice();
    cfg.operator_counts = cfg.operator_counts.slice();
    cfg.ratio = cfg.ratio.slice();
    return cfg;
  }

  /** 参数互检（config.py 的 validate_config）；不通过即抛错，与 Python 文案一致。 */
  function validateConfig(cfg) {
    const problems = [];
    if (!cfg.ops.length || cfg.ops.some((op) => !ALL_OPS.includes(op))) {
      problems.push(`ops 必须取自 ${ALL_OPS.join(', ')}，当前为 ${JSON.stringify(cfg.ops)}`);
    }
    if (cfg.count < 1) problems.push('count 必须 ≥ 1');
    if (!cfg.operator_counts.length || cfg.operator_counts.some((k) => k !== 1 && k !== 2)) {
      problems.push(`operator_counts 只能取 1 或 2，当前为 ${JSON.stringify(cfg.operator_counts)}`);
    }
    if (new Set(cfg.operator_counts).size !== cfg.operator_counts.length) {
      problems.push('operator_counts 不能有重复项');
    }
    if (cfg.operator_counts.length > 1) {
      if (cfg.ratio.length !== cfg.operator_counts.length) {
        problems.push('ratio 的项数必须与 operator_counts 一致');
      } else if (cfg.ratio.some((value) => value < 0)) {
        problems.push('ratio 不能有负数');
      } else if (cfg.ratio.reduce((a, b) => a + b, 0) === 0) {
        problems.push('ratio 不能全为 0');
      }
    }
    if (cfg.min_value < 0) problems.push('min_value 不能为负');
    if (cfg.max_value < cfg.min_value) problems.push('max_value 不能小于 min_value');
    if (cfg.max_value > cfg.max_result) problems.push('叶子操作数上界 max_value 不能超过 max_result');
    if (cfg.mul_min < 0 || cfg.mul_max < cfg.mul_min) problems.push('必须满足 0 ≤ mul_min ≤ mul_max');
    if (cfg.mul_max > cfg.max_value) problems.push('mul_max 不能超过 max_value');
    if (!PAREN_MODES.includes(cfg.paren)) {
      problems.push(`paren 必须取自 ${PAREN_MODES.join(', ')}，当前为 ${JSON.stringify(cfg.paren)}`);
    }
    if (cfg.paren === 'always' && !cfg.operator_counts.includes(2)) {
      problems.push("paren='always' 只对双运算符题有意义，operator_counts 需包含 2");
    }
    if (cfg.per_line < 1) problems.push('per_line 必须 ≥ 1');
    if (cfg.attempts_per_problem < 1) problems.push('attempts_per_problem 必须 ≥ 1');
    if (cfg.weights !== null && cfg.weights !== undefined) {
      const keys = Object.keys(cfg.weights);
      const bad = keys.filter((op) => !ALL_OPS.includes(op));
      if (bad.length) problems.push(`weights 中含未知运算符 ${JSON.stringify(bad)}`);
      if (keys.some((op) => cfg.weights[op] < 0)) problems.push('weights 不能为负');
      if (keys.length && keys.every((op) => cfg.weights[op] === 0)) problems.push('weights 不能全为 0');
    }
    if (problems.length) throw new Error('配置有误：' + problems.join('；'));
  }

  /* ────────────────────────────────────────────────────────────────────────
     §2 随机源

     不追求"与 Python 的 random 模块同序列"（那需要连 Mersenne Twister 的
     _randbelow 一起移植，收益为零）。这里的承诺是：同一个 seed 在本引擎内
     必然复现同一份题面——页面上的"复现"靠的是它。
     ──────────────────────────────────────────────────────────────────────── */

  function makeRng(seed) {
    let state = (seed >>> 0) || 0x9e3779b9;

    function next() {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    return {
      random: next,
      randint(low, high) { return low + Math.floor(next() * (high - low + 1)); },
      choice(items) { return items[Math.floor(next() * items.length)]; },
      shuffle(items) {
        for (let i = items.length - 1; i > 0; i -= 1) {
          const j = Math.floor(next() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
      },
    };
  }

  /* ────────────────────────────────────────────────────────────────────────
     §3 基础运算与候选集（core.py）
     ──────────────────────────────────────────────────────────────────────── */

  function noSolution(op, given) {
    const err = new Error(`运算符 ${JSON.stringify(op)} 在已知操作数为 ${given} 时无解`);
    err.name = 'NoSolution';
    return err;
  }

  function isNoSolution(err) {
    return err instanceof Error && err.name === 'NoSolution';
  }

  function mulBounds(cfg) {
    return [Math.max(cfg.min_value, cfg.mul_min), cfg.mul_max];
  }

  function divisorFloor(cfg) {
    return Math.max(1, cfg.min_value);
  }

  /** 已知左操作数时，可作右操作数的叶子候选集。 */
  function rightCandidates(cfg, op, leftValue) {
    const low = cfg.min_value;
    const high = cfg.max_value;
    const limit = cfg.max_result;
    const out = [];

    if (op === '+') {
      const upper = Math.min(high, limit - leftValue);
      for (let v = low; v <= upper; v += 1) out.push(v);
      return out;
    }
    if (op === '-') {
      const upper = Math.min(high, leftValue);
      for (let v = low; v <= upper; v += 1) out.push(v);
      return out;
    }
    if (op === '*') {
      const [mulLow, mulHigh] = mulBounds(cfg);
      if (leftValue < mulLow || leftValue > mulHigh) return out;
      if (leftValue === 0) {
        // 0 × y 恒为 0，不可能越界；这条分支同时挡住下面的整数除零。
        for (let v = mulLow; v <= mulHigh; v += 1) out.push(v);
        return out;
      }
      const upper = Math.min(mulHigh, Math.floor(limit / leftValue));
      for (let v = mulLow; v <= upper; v += 1) out.push(v);
      return out;
    }
    if (op === '/') {
      const floor = divisorFloor(cfg);
      if (leftValue === 0) {
        for (let v = floor; v <= high; v += 1) out.push(v);
        return out;
      }
      for (let v = floor; v <= high; v += 1) if (leftValue % v === 0) out.push(v);
      return out;
    }
    throw new Error(`未知运算符 ${JSON.stringify(op)}`);
  }

  /** 已知右操作数时，可作左操作数的叶子候选集。 */
  function leftCandidates(cfg, op, rightValue) {
    const low = cfg.min_value;
    const high = cfg.max_value;
    const limit = cfg.max_result;
    const out = [];

    if (op === '+') {
      const upper = Math.min(high, limit - rightValue);
      for (let v = low; v <= upper; v += 1) out.push(v);
      return out;
    }
    if (op === '-') {
      const lower = Math.max(low, rightValue);
      for (let v = lower; v <= high; v += 1) out.push(v);
      return out;
    }
    if (op === '*') {
      const [mulLow, mulHigh] = mulBounds(cfg);
      if (rightValue < mulLow || rightValue > mulHigh) return out;
      if (rightValue === 0) {
        for (let v = mulLow; v <= mulHigh; v += 1) out.push(v);
        return out;
      }
      const upper = Math.min(mulHigh, Math.floor(limit / rightValue));
      for (let v = mulLow; v <= upper; v += 1) out.push(v);
      return out;
    }
    if (op === '/') {
      if (rightValue === 0) return out; // 除数不能为 0，该运算符整体不可行
      const quotientLow = low === 0 ? 0 : Math.max(1, Math.ceil(low / rightValue));
      const quotientHigh = Math.floor(high / rightValue);
      for (let q = quotientLow; q <= quotientHigh; q += 1) out.push(rightValue * q);
      return out;
    }
    throw new Error(`未知运算符 ${JSON.stringify(op)}`);
  }

  function applyOp(op, a, b) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '*') return a * b;
    if (op === '/') {
      if (b === 0) throw new Error('除数为 0');
      if (a % b) throw new Error(`${a} ÷ ${b} 不能整除`);
      return Math.floor(a / b);
    }
    throw new Error(`未知运算符 ${JSON.stringify(op)}`);
  }

  function opsWithRightCandidate(cfg, leftValue) {
    return cfg.ops.filter((op) => rightCandidates(cfg, op, leftValue).length > 0);
  }

  function opsWithLeftCandidate(cfg, rightValue) {
    return cfg.ops.filter((op) => leftCandidates(cfg, op, rightValue).length > 0);
  }

  function quotientRange(cfg, divisor) {
    const quotientLow = cfg.min_value === 0 ? 0 : Math.max(1, Math.ceil(cfg.min_value / divisor));
    const quotientHigh = Math.floor(cfg.max_value / divisor);
    if (quotientHigh < quotientLow) return null;
    return [quotientLow, quotientHigh];
  }

  function canGenPair(cfg, op) {
    if (op === '+') return cfg.max_value >= cfg.min_value && cfg.max_result >= 2 * cfg.min_value;
    if (op === '-') return cfg.max_value >= cfg.min_value;
    if (op === '*') {
      const [mulLow, mulHigh] = mulBounds(cfg);
      if (mulLow > mulHigh || mulLow > cfg.max_value) return false;
      for (let left = mulLow; left <= Math.min(mulHigh, cfg.max_value); left += 1) {
        if (rightCandidates(cfg, '*', left).length) return true;
      }
      return false;
    }
    if (op === '/') {
      const floor = divisorFloor(cfg);
      for (let divisor = floor; divisor <= cfg.max_value; divisor += 1) {
        if (quotientRange(cfg, divisor) !== null) return true;
      }
      return false;
    }
    throw new Error(`未知运算符 ${JSON.stringify(op)}`);
  }

  function solvableOps(cfg) {
    return cfg.ops.filter((op) => canGenPair(cfg, op));
  }

  function pickWeighted(rng, items, weights) {
    const pool = items.slice();
    if (pool.length === 1 || !weights) return rng.choice(pool);
    const effective = pool.map((item) => (weights[item] === undefined ? 1 : weights[item]));
    const total = effective.reduce((a, b) => a + b, 0);
    if (total <= 0) return rng.choice(pool);
    let roll = rng.random() * total;
    for (let i = 0; i < pool.length; i += 1) {
      roll -= effective[i];
      if (roll < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  /** 生成一对满足全部约束的 (左操作数, 右操作数)。 */
  function genPair(cfg, rng, op) {
    if (op === '/') {
      const floor = divisorFloor(cfg);
      const divisors = [];
      for (let d = floor; d <= cfg.max_value; d += 1) {
        if (quotientRange(cfg, d) !== null) divisors.push(d);
      }
      if (!divisors.length) throw noSolution(op, cfg.max_value);
      const divisor = rng.choice(divisors);
      const range = quotientRange(cfg, divisor);
      const quotient = rng.randint(range[0], range[1]);
      return [divisor * quotient, divisor];
    }

    if (op === '*') {
      const [mulLow, mulHigh] = mulBounds(cfg);
      const usable = [];
      for (let left = mulLow; left <= Math.min(mulHigh, cfg.max_value); left += 1) {
        if (rightCandidates(cfg, '*', left).length) usable.push(left);
      }
      if (!usable.length) throw noSolution(op, cfg.mul_max);
      const leftValue = rng.choice(usable);
      return [leftValue, rng.choice(rightCandidates(cfg, '*', leftValue))];
    }

    let leftHigh = cfg.max_value;
    if (op === '+') leftHigh = Math.min(leftHigh, cfg.max_result - cfg.min_value);
    const leftValue = rng.randint(cfg.min_value, leftHigh);
    const candidates = rightCandidates(cfg, op, leftValue);
    if (!candidates.length) throw noSolution(op, leftValue);
    return [leftValue, rng.choice(candidates)];
  }

  /* ────────────────────────────────────────────────────────────────────────
     §4 表达式树（model.py）
     ──────────────────────────────────────────────────────────────────────── */

  function leaf(value) {
    return { value, op: null, left: null, right: null };
  }

  function makeNode(op, left, right) {
    return { value: applyOp(op, left.value, right.value), op, left, right };
  }

  function isLeaf(node) {
    return node.op === null;
  }

  /** 先序遍历自身与全部后代——顺序必须与 Python 的 iter_nodes 一致。 */
  function iterNodes(root) {
    const out = [];
    (function walk(node) {
      out.push(node);
      if (node.left !== null) walk(node.left);
      if (node.right !== null) walk(node.right);
    })(root);
    return out;
  }

  function iterOperators(root) {
    return iterNodes(root).filter((node) => !isLeaf(node));
  }

  function leafValues(root) {
    return iterNodes(root).filter(isLeaf).map((node) => node.value);
  }

  function operatorCount(root) {
    return iterOperators(root).length;
  }

  /* ────────────────────────────────────────────────────────────────────────
     §5 独立求值器（validate.py 的 _lex / _Parser / eval_text）

     它只认题面文本、按标准优先级解析，不读树的任何结构信息。
     这是整个项目"括号与优先级有没有拼错"的结构性保障，
     所以移植时一个字都不改。
     ──────────────────────────────────────────────────────────────────────── */

  function InvalidExpression(message) {
    const err = new Error(message);
    err.name = 'InvalidExpression';
    return err;
  }

  function tokenize(text) {
    const tokens = [];
    let index = 0;
    while (index < text.length) {
      const char = text[index];
      if (/\s/.test(char)) { index += 1; continue; }
      if (char >= '0' && char <= '9') {
        let end = index;
        while (end < text.length && text[end] >= '0' && text[end] <= '9') end += 1;
        tokens.push({ kind: 'num', value: Number.parseInt(text.slice(index, end), 10) });
        index = end;
        continue;
      }
      const normalized = SYMBOL_ALIASES[char] || char;
      if ('+-*/()'.includes(normalized)) {
        tokens.push({ kind: 'op', value: normalized });
        index += 1;
        continue;
      }
      throw InvalidExpression(`出现无法识别的字符 ${JSON.stringify(char)}`);
    }
    if (!tokens.length) throw InvalidExpression('算式为空');
    return tokens;
  }

  /** 按标准优先级求值；返回 {value, values}，values 含每个字面量与每一步中间结果。 */
  function evalText(text) {
    const tokens = tokenize(text);
    let pos = 0;
    const values = [];

    function peekOp() {
      return pos < tokens.length && tokens[pos].kind === 'op' ? tokens[pos].value : null;
    }
    function take() {
      if (pos >= tokens.length) throw InvalidExpression('算式意外结束');
      return tokens[pos++];
    }
    function expr() {
      let value = term();
      while (peekOp() === '+' || peekOp() === '-') {
        const op = take().value;
        const right = term();
        value = op === '+' ? value + right : value - right;
        values.push(value);
      }
      return value;
    }
    function term() {
      let value = factor();
      while (peekOp() === '*' || peekOp() === '/') {
        const op = take().value;
        const right = factor();
        if (op === '*') {
          value *= right;
        } else {
          if (right === 0) throw InvalidExpression('除数为 0');
          if (value % right) throw InvalidExpression(`${value} ÷ ${right} 不能整除`);
          value = Math.floor(value / right);
        }
        values.push(value);
      }
      return value;
    }
    function factor() {
      const token = take();
      if (token.kind === 'num') { values.push(token.value); return token.value; }
      if (token.value === '(') {
        const value = expr();
        const close = take();
        if (close.kind !== 'op' || close.value !== ')') {
          throw InvalidExpression('左括号没有对应的右括号');
        }
        return value;
      }
      throw InvalidExpression(`不应出现的符号 ${JSON.stringify(token.value)}`);
    }

    const result = expr();
    if (pos !== tokens.length) {
      throw InvalidExpression('算式在应有结尾处仍有剩余内容，括号可能不配对');
    }
    return { value: result, values };
  }

  /* ────────────────────────────────────────────────────────────────────────
     §6 硬约束判定与渲染（validate.py 的 validate_problem、render.py）
     ──────────────────────────────────────────────────────────────────────── */

  function isInvalidExpression(err) {
    return err instanceof Error && err.name === 'InvalidExpression';
  }

  /** 逐条核对硬约束，返回违规说明列表（空列表表示全部通过）。 */
  function validateProblem(problem, cfg) {
    const errors = [];
    const root = problem.root;

    const count = operatorCount(root);
    if (count !== 1 && count !== 2) errors.push(`运算符个数为 ${count}，要求 1 或 2`);

    for (const node of iterNodes(root)) {
      if (!Number.isInteger(node.value)) { errors.push(`出现非整数数值 ${node.value}`); continue; }
      if (node.value < 0) errors.push(`出现负数 ${node.value}`);
      if (node.value > cfg.max_result) errors.push(`数值 ${node.value} 超过上界 ${cfg.max_result}`);
      if (!isLeaf(node) && !(node.op in OP_PRECEDENCE)) errors.push(`出现未知运算符 ${node.op}`);
    }

    for (const value of leafValues(root)) {
      if (value < cfg.min_value || value > cfg.max_value) {
        errors.push(`叶子操作数 ${value} 不在 [${cfg.min_value}, ${cfg.max_value}] 内`);
      }
    }

    for (const node of iterOperators(root)) {
      const left = node.left;
      const right = node.right;
      if (left === null || right === null) { errors.push(`运算符 ${node.op} 缺少操作数`); continue; }
      if (node.op === '/') {
        if (right.value === 0) errors.push('出现除数为 0 的除法');
        else if (left.value % right.value) errors.push(`${left.value} ÷ ${right.value} 不能整除`);
      }
      if (node.op === '*') {
        const [mulLow, mulHigh] = mulBounds(cfg);
        for (const operand of [left.value, right.value]) {
          if (operand < mulLow || operand > mulHigh) {
            errors.push(`乘法操作数 ${operand} 不在九九表区间 [${mulLow}, ${mulHigh}] 内`);
          }
        }
      }
    }

    try {
      const parsed = evalText(problem.text);
      if (parsed.value !== problem.answer) {
        errors.push(`回读校验不符：题面算得 ${parsed.value}，记录答案为 ${problem.answer}`);
      }
      if (parsed.value !== root.value) {
        errors.push(`回读校验不符：题面算得 ${parsed.value}，表达式树为 ${root.value}`);
      }
      for (const item of parsed.values) {
        if (item < 0) errors.push(`题面求值过程中出现负数 ${item}`);
        if (item > cfg.max_result) errors.push(`题面求值过程中出现 ${item}，超过上界 ${cfg.max_result}`);
      }
    } catch (err) {
      if (!isInvalidExpression(err)) throw err;
      errors.push(`题面无法解析：${err.message}`);
    }

    if (!cfg.allow_zero_result && problem.answer === 0) {
      errors.push('结果为 0，但配置要求不允许');
    }
    return errors;
  }

  function renderNode(node, droppable) {
    if (isLeaf(node)) return String(node.value);
    const text = `${renderNode(node.left, droppable)} ${OP_DISPLAY[node.op]} ${renderNode(node.right, droppable)}`;
    return droppable.has(node) ? text : `(${text})`;
  }

  function plainText(root) {
    return renderNode(root, new Set(iterNodes(root)));
  }

  function isAcceptable(cfg, text, target) {
    let parsed;
    try {
      parsed = evalText(text);
    } catch (err) {
      if (!isInvalidExpression(err)) throw err;
      return false;
    }
    if (parsed.value !== target) return false;
    return parsed.values.every((item) => item >= 0 && item <= cfg.max_result);
  }

  /**
   * 渲染算式本体，只在括号必需处保留括号。
   *
   * 判据是"去掉括号后按标准优先级重新求值是否等价，且展开过程每一步也在界内"。
   * 第二条不能省：6 × (88 ÷ 11) 的值与 6 × 88 ÷ 11 相同，
   * 但学生实际要先算 528，越界了，括号必须留。
   */
  function renderExpr(root, cfg) {
    let droppable = new Set([root]);
    for (const node of iterNodes(root)) {
      if (isLeaf(node) || node === root) continue;
      const trial = new Set(droppable);
      trial.add(node);
      if (isAcceptable(cfg, renderNode(root, trial), root.value)) droppable = trial;
    }
    return renderNode(root, droppable);
  }

  function normalizeText(text) {
    return text.replace(/\s+/g, '').replace(/[×÷−⋅·]/g, (ch) => NORMALIZE_MAP[ch]);
  }

  function displayWidth(text) {
    let width = 0;
    for (const char of text) {
      const code = char.codePointAt(0);
      const wide =
        (code >= 0x1100 && code <= 0x115f) ||
        (code >= 0x2e80 && code <= 0xa4cf) ||
        (code >= 0xac00 && code <= 0xd7a3) ||
        (code >= 0xf900 && code <= 0xfaff) ||
        (code >= 0xfe30 && code <= 0xfe6f) ||
        (code >= 0xff00 && code <= 0xff60) ||
        (code >= 0xffe0 && code <= 0xffe6);
      width += wide ? 2 : 1;
    }
    return width;
  }

  function renderProblem(problem, showAnswer) {
    const body = `${problem.text} = `;
    return showAnswer ? body + String(problem.answer) : body;
  }

  /** 把一批题目排成整卷的纯文本题面（render.py 的 render_sheet）。 */
  function renderSheet(problems, perLine = 4, showAnswer = false, indexStart = 1) {
    const cells = problems.map(
      (problem, offset) => `${String(indexStart + offset).padStart(3)}. ${renderProblem(problem, showAnswer)}`,
    );
    if (!cells.length) return '';
    const columnWidth = Math.max(...cells.map(displayWidth)) + 3;
    const lines = [];
    for (let start = 0; start < cells.length; start += perLine) {
      const row = cells.slice(start, start + perLine);
      const padded = row.map((cell) => cell + ' '.repeat(columnWidth - displayWidth(cell))).join('');
      lines.push(padded.replace(/\s+$/, ''));
      if (start + perLine < cells.length) lines.push('');
    }
    return lines.join('\n');
  }

  /* ────────────────────────────────────────────────────────────────────────
     §7 生成调度（generator.py）
     ──────────────────────────────────────────────────────────────────────── */

  const DEDUP_STRIKES_BEFORE_EXHAUSTED = 1000;

  function buildTwoNumber(cfg, rng, op) {
    const [left, right] = genPair(cfg, rng, op);
    return makeNode(op, leaf(left), leaf(right));
  }

  /** 某结构是否在**任何取值下**都不需要括号（paren='none' 用的速判表）。 */
  function parenNeverNeeded(shape, opInner, opOuter) {
    const inner = OP_PRECEDENCE[opInner];
    const outer = OP_PRECEDENCE[opOuter];
    if (shape === 'A') return inner >= outer;
    if (outer < inner) return true;
    if (outer === inner) return opOuter === '+' || opOuter === '*';
    return false;
  }

  function allowedOuterOps(cfg, shape, opInner, outerPool) {
    if (cfg.paren !== 'none') return outerPool.slice();
    return outerPool.filter((op) => parenNeverNeeded(shape, opInner, op));
  }

  function buildShapeA(cfg, rng) {
    const pool = solvableOps(cfg);
    const innerPool = pool.filter((op) => allowedOuterOps(cfg, 'A', op, pool).length > 0);
    if (!innerPool.length) throw noSolution('A', 0);
    const op1 = pickWeighted(rng, innerPool, cfg.weights);
    const inner = buildTwoNumber(cfg, rng, op1);

    const outerPool = allowedOuterOps(cfg, 'A', op1, opsWithRightCandidate(cfg, inner.value));
    if (!outerPool.length) throw noSolution(op1, inner.value);
    const op2 = pickWeighted(rng, outerPool, cfg.weights);
    const third = rng.choice(rightCandidates(cfg, op2, inner.value));
    return makeNode(op2, inner, leaf(third));
  }

  function buildShapeB(cfg, rng) {
    const pool = solvableOps(cfg);
    const innerPool = pool.filter((op) => allowedOuterOps(cfg, 'B', op, pool).length > 0);
    if (!innerPool.length) throw noSolution('B', 0);
    const op2 = pickWeighted(rng, innerPool, cfg.weights);
    const inner = buildTwoNumber(cfg, rng, op2);

    const outerPool = allowedOuterOps(cfg, 'B', op2, opsWithLeftCandidate(cfg, inner.value));
    if (!outerPool.length) throw noSolution(op2, inner.value);
    const op1 = pickWeighted(rng, outerPool, cfg.weights);
    const first = rng.choice(leftCandidates(cfg, op1, inner.value));
    return makeNode(op1, leaf(first), inner);
  }

  function buildExpression(cfg, rng, operatorCountValue) {
    if (operatorCountValue === 1) {
      const pool = solvableOps(cfg);
      if (!pool.length) throw noSolution('single', 0);
      const op = pickWeighted(rng, pool, cfg.weights);
      return buildTwoNumber(cfg, rng, op);
    }
    if (operatorCountValue === 2) {
      return rng.random() < 0.5 ? buildShapeA(cfg, rng) : buildShapeB(cfg, rng);
    }
    throw new Error(`运算符个数只能是 1 或 2，收到 ${operatorCountValue}`);
  }

  function hasTrivialForm(root) {
    for (const node of iterOperators(root)) {
      const left = node.left.value;
      const right = node.right.value;
      if (node.op === '*' && (left === 1 || right === 1)) return true;
      if (node.op === '/' && right === 1) return true;
      if (left === 0 && right === 0) return true;
    }
    return false;
  }

  function zeroOnlyAsAnswer(root) {
    for (const node of iterNodes(root)) {
      if (isLeaf(node) && node.value === 0) return false;
      if (!isLeaf(node) && node !== root && node.value === 0) return false;
    }
    return true;
  }

  function accept(cfg, root) {
    const text = renderExpr(root, cfg);
    if (cfg.paren === 'none' && text.includes('(')) return '无括号模式下出现了括号';
    if (cfg.paren === 'always' && !text.includes('(')) return '括号模式下未能生成含括号的题';
    if (cfg.exclude_trivial && hasTrivialForm(root)) return '命中平凡题过滤';
    if (cfg.exclude_zero_forms && !zeroOnlyAsAnswer(root)) return '命中 0 形式过滤';
    if (!cfg.allow_zero_result && root.value === 0) return '结果为 0，但配置不允许';
    return null;
  }

  /** 按 ratio 用最大余数法把 count 个名额精确分给各运算符个数。 */
  function allocateQuotas(cfg) {
    const kinds = cfg.operator_counts.slice();
    if (kinds.length === 1) return { [kinds[0]]: cfg.count };

    const total = cfg.ratio.reduce((a, b) => a + b, 0);
    const exact = cfg.ratio.map((weight) => (cfg.count * weight) / total);
    const quota = exact.map((value) => Math.trunc(value));
    const shortfall = cfg.count - quota.reduce((a, b) => a + b, 0);
    const order = kinds
      .map((_, index) => index)
      .sort((a, b) => (exact[b] - quota[b]) - (exact[a] - quota[a]) || a - b);
    for (const index of order.slice(0, shortfall)) quota[index] += 1;

    const result = {};
    kinds.forEach((kind, index) => { result[kind] = quota[index]; });
    return result;
  }

  class GenerationError extends Error {
    constructor(message) {
      super(message);
      this.name = 'GenerationError';
    }
  }

  function generateKind(cfg, rng, kind, quota, seen) {
    const problems = [];
    let repeats = 0;
    let strikes = 0;
    let exhausted = false;
    let attempts = 0;
    const attemptLimit = Math.max(quota * cfg.attempts_per_problem, cfg.attempts_per_problem);

    while (problems.length < quota && attempts < attemptLimit) {
      attempts += 1;
      let root;
      try {
        root = buildExpression(cfg, rng, kind);
      } catch (err) {
        if (isNoSolution(err)) continue;
        throw err;
      }
      if (accept(cfg, root) !== null) continue;

      const text = renderExpr(root, cfg);
      const key = normalizeText(text);
      if (seen.has(key)) {
        strikes += 1;
        if (strikes >= DEDUP_STRIKES_BEFORE_EXHAUSTED) exhausted = true;
        if (!cfg.allow_repeat) {
          if (exhausted) break;
          continue;
        }
        repeats += 1;
      } else {
        strikes = 0;
        seen.add(key);
      }

      const problem = { root, text, answer: root.value, textNorm: key };
      const errors = validateProblem(problem, cfg);
      if (errors.length) {
        throw new GenerationError(`生成结果未通过自校验（题面 ${JSON.stringify(text)}）：${errors.join('；')}`);
      }
      problems.push(problem);
    }

    return {
      kind,
      wanted: quota,
      produced: problems.length,
      repeats,
      exhausted,
      problems,
    };
  }

  function buildHint(reports) {
    const notes = [];
    const missing = reports.filter((report) => report.wanted - report.produced > 0);
    if (missing.length) {
      const detail = missing
        .map((report) => `${report.kind} 个运算符的题需要 ${report.wanted} 道，不重复的题面只够 ${report.produced} 道`)
        .join('、');
      notes.push(`题量不足：${detail}`);
    }
    const repeated = reports.reduce((sum, report) => sum + report.repeats, 0);
    if (repeated) notes.push(`有 ${repeated} 道题目与卷中其他题目重复`);
    if (!notes.length) return null;

    const advices = ['放宽数值范围', '增加可用的运算符', '减少题量'];
    if (repeated === 0) advices.unshift('允许题面重复');
    return `${notes.join('；')}。可尝试：${advices.join('、')}。`;
  }

  function generateProblems(cfg, rng) {
    validateConfig(cfg);
    const quotas = allocateQuotas(cfg);
    const seen = new Set();
    const problems = [];
    const reports = [];

    for (const kind of Object.keys(quotas).map(Number).sort((a, b) => a - b)) {
      const quota = quotas[kind];
      if (quota <= 0) continue;
      const report = generateKind(cfg, rng, kind, quota, seen);
      problems.push(...report.problems);
      reports.push(report);
    }

    rng.shuffle(problems);
    return { problems, hint: buildHint(reports) };
  }

  /* ────────────────────────────────────────────────────────────────────────
     §8 出题入口（源 web.py 的 meta_payload / generate_payload）

     页面只调用这两个函数。每一题都连 answer 与 tree 一起给出：
     answer 供"显示答案"开关就地重画（切换开关属于改视图，不该重新出题），
     tree 供 tests/test_engine_parity.py 交回 Python 侧逐题复核。
     ──────────────────────────────────────────────────────────────────────── */

  function meta() {
    return {
      defaults: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
      ops: ALL_OPS.slice(),
      opDisplay: Object.assign({}, OP_DISPLAY),
      parenModes: PAREN_MODES.slice(),
      // 页面据此提示当前是哪条路径
      engine: 'browser',
    };
  }

  function generate(payload) {
    const cfg = configFromPayload(payload);

    const seed = cfg.seed !== null ? cfg.seed : 1 + Math.floor(Math.random() * (2 ** 31 - 1));
    const rng = makeRng(seed);

    const started = (global.performance || Date).now();
    const { problems, hint } = generateProblems(cfg, rng);
    const elapsedMs = ((global.performance || Date).now() - started);

    return {
      problems: problems.map((problem, position) => ({
        index: position + 1,
        text: problem.text,
        operatorCount: operatorCount(problem.root),
        answer: problem.answer,
        tree: toPlainTree(problem.root),
      })),
      sheet: renderSheet(problems, cfg.per_line, false),
      requested: cfg.count,
      produced: problems.length,
      perLine: cfg.per_line,
      seed,
      seedProvided: cfg.seed !== null,
      hint,
      elapsedMs: Math.round(elapsedMs * 10) / 10,
    };
  }

  function toPlainTree(node) {
    if (isLeaf(node)) return { kind: 'leaf', value: node.value };
    return {
      kind: 'operator',
      op: node.op,
      value: node.value,
      left: toPlainTree(node.left),
      right: toPlainTree(node.right),
    };
  }

  global.SCEngine = {
    meta,
    generate,
    // 页面切换"显示答案"时用它重排复制文本。之所以要排两次而不是让后端
    // 一次给两份：切换开关属于改视图，不该重新出题（重新出题就换了一批题）。
    // 排版也只有这一份实现——不能从 DOM 里抠文本，那样列对齐就丢了。
    renderSheet,
    // 供交叉验证脚本取用。
    internal: {
      ALL_OPS,
      OP_DISPLAY,
      OP_PRECEDENCE,
      DEFAULT_CONFIG,
      configFromPayload,
      validateConfig,
      evalText,
      renderExpr,
      renderSheet,
      validateProblem,
      normalizeText,
      parseText: evalText,
      makeRng,
      buildExpression,
      generateProblems,
      applyOp,
      rightCandidates,
      leftCandidates,
      solvableOps,
    },
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script id="sc-app">
/* ==========================================================================
   口算练习 · 出题台 —— 页面交互

   页面自身不做任何出题计算：它只把表单收成一份参数、交给随页面一起加载的
   出题引擎，再把返回的题面画出来。

   引擎就内联在这张 HTML 里（经典 <script>，不是 ES module——`file://` 下
   module 会被 CORS 拦掉，实测）。所以这张页面双击就能用：不需要服务、
   不需要 Python、不需要联网。

   出题逻辑的权威实现在 Python 侧（src/simple_calculate/），这里是它的移植，
   两者的一致性由 tests/test_engine_parity.py 交叉验证盯着。
   ========================================================================== */

(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  const el = {
    app: $('app'),
    grid: $('grid'),
    paperMeta: $('paperMeta'),
    placeholder: $('paperPlaceholder'),
    hint: $('hint'),
    shuffle: $('shuffleBtn'),
    reset: $('resetBtn'),
    copy: $('copyBtn'),
    answer: $('answerBtn'),
    statusCount: $('statusCount'),
    statusMix: $('statusMix'),
    perLineHint: $('perLineHint'),
    ratioField: $('ratioField'),
    ratioRange: $('ratioRange'),
    ratioOut: $('ratioOut'),
  };

  const state = {
    meta: null,
    problems: [],    // 当前这一批题（含答案）。"显示答案"就地重画，不重新出题
    perLine: 4,
    showAnswers: false,
    timer: null,     // scheduleGenerate 的防抖句柄
  };

  const COUNT_MIN = 1;
  const COUNT_MAX = 1000;

  /* ───────────────────── 出题引擎 ───────────────────── */

  // 引擎随页面一起加载：没有网络、没有进程、没有备用路径。
  // 它为 null 只有一种可能——这张 HTML 被改坏了（内联的 <script> 被删掉或改残）。
  const engine = window.SCEngine || null;

  /* ───────────────────── 小工具 ───────────────────── */

  function clamp(value, low, high) {
    if (!Number.isFinite(value)) return low;
    return Math.min(high, Math.max(low, value));
  }

  function readInt(input, fallback) {
    const value = Number.parseInt(input.value, 10);
    return Number.isFinite(value) ? value : fallback;
  }

  function setSeg(box, active) {
    $$('button', box).forEach((btn) => btn.classList.toggle('on', btn === active));
  }

  function activeValue(box) {
    return box.querySelector('button.on')?.dataset.v ?? null;
  }

  function flash(button, text) {
    const original = button.innerHTML;
    button.classList.add('done');
    button.innerHTML = text;
    window.setTimeout(() => {
      button.classList.remove('done');
      button.innerHTML = original;
    }, 1500);
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // 非安全上下文下的回退路径
      try {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        return true;
      } catch {
        return false;
      }
    }
  }

  /* ───────────────────── 表单 → 参数 ───────────────────── */

  function currentOperatorCounts() {
    const raw = activeValue($('opCountBox'));
    return raw === '1,2' ? [1, 2] : [Number(raw)];
  }

  function readForm() {
    const operatorCounts = currentOperatorCounts();
    const maxValue = clamp(readInt($('maxValueInput'), 99), 10, 99);
    const mulTable = $('mulTableInput').checked;
    const allowZero = $('allowZeroInput').checked;

    const payload = {
      count: clamp(readInt($('countInput'), 20), COUNT_MIN, COUNT_MAX),
      ops: $$('#opsBox button.on').map((btn) => btn.dataset.op),
      operator_counts: operatorCounts,
      per_line: Number(activeValue($('perLineBox'))),
      paren: 'necessary',
      min_value: allowZero ? 0 : 1,
      max_value: maxValue,
      // 九九表两条边界必须一起动：只改上界会让 0 在一个方向上合法、另一个方向上非法。
      mul_min: mulTable ? 1 : 0,
      mul_max: mulTable ? Math.min(9, maxValue) : maxValue,
      allow_zero_result: $('zeroResultInput').checked,
      exclude_trivial: $('trivialInput').checked,
      exclude_zero_forms: !allowZero,
      allow_repeat: false,
      seed: null,
    };

    if (operatorCounts.length === 2) {
      const single = Number(el.ratioRange.value);
      payload.ratio = [single, 10 - single];
    }

    return payload;
  }

  /* ───────────────────── 参数 → 界面 ───────────────────── */

  function syncRatioVisibility() {
    el.ratioField.hidden = currentOperatorCounts().length < 2;
  }

  function syncRatioOutput() {
    const single = Number(el.ratioRange.value);
    const ratio = `${single} : ${10 - single}`;
    el.ratioOut.textContent = ratio;
    el.ratioRange.style.setProperty('--fill', `${((single - 1) / 8) * 100}%`);
  }

  /** 让快捷值按钮反映当前输入框的值，否则那排按钮看不出选中了哪个。 */
  function syncPresets() {
    const count = String(clamp(readInt($('countInput'), 20), COUNT_MIN, COUNT_MAX));
    $$('[data-count]').forEach((btn) => {
      btn.classList.toggle('on', btn.dataset.count === count);
    });

    const maxValue = String(clamp(readInt($('maxValueInput'), 99), 10, 99));
    $$('[data-max]').forEach((btn) => {
      btn.classList.toggle('on', btn.dataset.max === maxValue);
    });
  }

  /* ───────────────────── 渲染 ───────────────────── */

  function renderGrid() {
    const perLine = String(state.perLine);
    el.grid.dataset.perLine = perLine;
    el.grid.style.setProperty('--per-line', perLine);

    const items = state.problems.map((problem) => {
      const item = document.createElement('div');
      item.className = 'item';

      const index = document.createElement('span');
      index.className = 'idx';
      index.textContent = `${problem.index}.`;

      const expr = document.createElement('span');
      expr.className = 'expr';
      expr.textContent = `${problem.text} =`;

      item.append(index, expr);

      if (state.showAnswers) {
        const answer = document.createElement('span');
        answer.className = 'ans';
        answer.textContent = String(problem.answer);
        item.append(answer);
      }
      return item;
    });

    el.grid.replaceChildren(...items);
    el.placeholder.hidden = items.length > 0;
    syncPerLineHint();
  }

  /** 「每行排几题」是上限，不是硬指标：窗口不够宽时实际列数会自己少一档。
   *
   * 与其让面板写着 4、卷面上却排了 2，不如把落差说清楚。
   * 这里只能量、不能算——实际列宽由窗口宽度、左侧面板、纸的页边距三者共同
   * 决定，事先推不出来，所以数一下 grid 真的分了几列。
   */
  function syncPerLineHint() {
    const tracks = getComputedStyle(el.grid).gridTemplateColumns;
    const cols = tracks ? tracks.split(' ').length : 0;
    el.perLineHint.textContent =
      cols && cols < state.perLine ? `窗口不够宽，已按 ${cols} 列排` : '';
  }

  /** 复制用的纯文本题面。
   *
   * 现场排，而不是从 DOM 里抠文本——抠出来的会丢掉列对齐，那就白排了。
   * 也不能只排一次存起来：切换"显示答案"就得换一份排版，
   * 而它是个随时可切的视图开关。
   * （引擎的 renderSheet 与 Python 的 render_sheet 逐字符一致，有交叉验证盯着。）
   */
  function sheetText() {
    if (!state.problems.length) return '';
    return engine.renderSheet(state.problems, state.perLine, state.showAnswers);
  }

  /** 让按钮上的文字与 data-answers 都反映当前的开关状态。 */
  function syncAnswerSwitch() {
    el.app.dataset.answers = state.showAnswers ? '1' : '0';
    el.answer.classList.toggle('on', state.showAnswers);
    el.answer.setAttribute('aria-pressed', state.showAnswers ? 'true' : 'false');
    const label = el.answer.querySelector('span');
    if (label) label.textContent = state.showAnswers ? '隐藏答案' : '显示答案';
  }

  function renderStatus(data) {
    const single = data.problems.filter((p) => p.operatorCount === 1).length;
    const double = data.problems.length - single;

    el.statusCount.textContent = data.produced === data.requested
      ? `${data.produced} 题`
      : `${data.produced} / ${data.requested} 题`;
    el.statusMix.textContent = `单 ${single} · 双 ${double}`;
  }

  function showHint(message, isError = false) {
    el.hint.hidden = !message;
    el.hint.classList.toggle('error', isError);
    el.hint.textContent = message || '';
  }

  function applyResult(data) {
    state.problems = data.problems || [];
    state.perLine = data.perLine;
    renderGrid();
    renderStatus(data);
    showHint(data.hint);
  }

  /* ───────────────────── 出题 ───────────────────── */

  // 引擎是同步的：调完就有结果。没有"回包过期"这回事，所以不需要请求序号，
  // 也不需要 loading 态——那套东西是为网络往返准备的，这里没有网络。
  function generate() {
    let data;
    try {
      data = engine.generate(readForm());
    } catch (error) {
      showHint(error.message, true);
      return;
    }
    applyResult(data);
  }

  function scheduleGenerate(delay = 230) {
    window.clearTimeout(state.timer);
    state.timer = window.setTimeout(generate, delay);
  }

  /* ───────────────────── 恢复默认 ───────────────────── */

  function applyDefaults() {
    const d = state.meta.defaults;

    $('countInput').value = d.count;

    $$('#opsBox button').forEach((btn) => {
      btn.classList.toggle('on', d.ops.includes(btn.dataset.op));
    });

    const countsKey = d.operator_counts.join(',');
    setSeg($('opCountBox'), $$('#opCountBox button').find((b) => b.dataset.v === countsKey));

    const ratioTotal = d.ratio[0] + d.ratio[1];
    el.ratioRange.value = String(clamp(Math.round((d.ratio[0] / ratioTotal) * 10), 1, 9));

    setSeg($('perLineBox'), $$('#perLineBox button').find((b) => b.dataset.v === String(d.per_line)));
    $('maxValueInput').value = d.max_value;
    $('allowZeroInput').checked = d.min_value === 0;
    $('mulTableInput').checked = d.mul_min >= 1 && d.mul_max <= 9;
    $('zeroResultInput').checked = d.allow_zero_result;
    $('trivialInput').checked = d.exclude_trivial;
    syncRatioOutput();
    syncRatioVisibility();
    syncPresets();
  }

  /* ───────────────────── 事件绑定 ───────────────────── */

  function bind() {
    // 题量
    $('countInput').addEventListener('input', () => {
      syncPresets();
      scheduleGenerate(400);
    });
    $('countInput').addEventListener('blur', () => {
      $('countInput').value = clamp(readInt($('countInput'), 20), COUNT_MIN, COUNT_MAX);
      syncPresets();
    });
    $$('[data-count]').forEach((btn) => btn.addEventListener('click', () => {
      $('countInput').value = btn.dataset.count;
      syncPresets();
      generate();
    }));

    // 运算符：至少保留一个
    $('opsBox').addEventListener('click', (event) => {
      const btn = event.target.closest('button');
      if (!btn) return;
      const selected = $$('#opsBox button.on');
      if (btn.classList.contains('on') && selected.length === 1) return;
      btn.classList.toggle('on');
      scheduleGenerate();
    });

    // 运算符个数
    $('opCountBox').addEventListener('click', (event) => {
      const btn = event.target.closest('button');
      if (!btn) return;
      setSeg($('opCountBox'), btn);
      syncRatioVisibility();
      scheduleGenerate();
    });

    // 配比
    el.ratioRange.addEventListener('input', () => {
      syncRatioOutput();
      scheduleGenerate(160);
    });

    // 每行题数
    $('perLineBox').addEventListener('click', (event) => {
      const btn = event.target.closest('button');
      if (!btn) return;
      setSeg($('perLineBox'), btn);
      scheduleGenerate();
    });

    // 操作数最大值
    $('maxValueInput').addEventListener('input', () => {
      syncPresets();
      scheduleGenerate(400);
    });
    $('maxValueInput').addEventListener('blur', () => {
      $('maxValueInput').value = clamp(readInt($('maxValueInput'), 99), 10, 99);
      syncPresets();
    });
    $$('[data-max]').forEach((btn) => btn.addEventListener('click', () => {
      $('maxValueInput').value = btn.dataset.max;
      syncPresets();
      generate();
    }));

    // 数值选项
    ['allowZeroInput', 'mulTableInput', 'zeroResultInput', 'trivialInput'].forEach((id) => {
      $(id).addEventListener('change', () => scheduleGenerate());
    });

    // 窗口宽度变了，能排下的列数也会跟着变：不必重新出题，但提示要跟上
    window.addEventListener('resize', syncPerLineHint);

    // 主操作
    el.shuffle.addEventListener('click', generate);

    // 答案开关：只重画卷面，不重新出题——所以这里刻意不走 generate()。
    // 换一批题会把题目换掉，而"我想看一眼答案"不该有这种副作用。
    el.answer.addEventListener('click', () => {
      state.showAnswers = !state.showAnswers;
      syncAnswerSwitch();
      renderGrid();
    });

    el.copy.addEventListener('click', async () => {
      const text = sheetText();
      if (!text) return;
      const ok = await copyToClipboard(text);
      flash(el.copy, ok
        ? '<span>已复制</span>'
        : '<span>复制失败，请手动选中</span>');
    });

    el.reset.addEventListener('click', () => {
      applyDefaults();
      generate();
    });

    // 标题被清空时补回默认值，否则卷面上就少了个题头
    $('paperTitle').addEventListener('blur', () => {
      if (!$('paperTitle').textContent.trim()) {
        $('paperTitle').textContent = '口算练习';
      }
    });
  }

  /* ───────────────────── 启动 ───────────────────── */

  function init() {
    // 引擎是内联的，正常不会缺；缺了说明这张 HTML 被改坏了。说清楚，别让页面白屏。
    if (!engine) {
      showHint('出题引擎未能加载。这张页面本应自带引擎，可能是文件被改动或截断了。', true);
      el.placeholder.hidden = true;
      return;
    }

    try {
      state.meta = engine.meta();
    } catch (error) {
      showHint(error.message, true);
      el.placeholder.hidden = true;
      return;
    }

    applyDefaults();
    syncAnswerSwitch();
    bind();
    generate();
  }

  init();
})();
</script>
