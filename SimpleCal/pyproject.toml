[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-calculate"
version = "0.1.0"
description = "面向小学生的四则运算题目生成器（命令行 + 网页版）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
simple-calculate = "simple_calculate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
